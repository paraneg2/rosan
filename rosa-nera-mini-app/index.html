<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="ROSA NERA — product collection">
  <title>ROSA NERA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button view-toggle" id="viewToggle" aria-label="Switch catalogue layout" title="Switch layout">
        <svg id="viewIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <a class="brand" href="#" aria-label="ROSA NERA home">
        <span class="brand-mark">R</span>
        <span class="brand-name">ROSA <i>NERA</i></span>
      </a>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <main>
      <section class="catalog-section" id="catalogSection">
        <div class="section-heading">
          <div>
            <p class="eyebrow">THE COLLECTION</p>
            <h1>Discover the collection</h1>
          </div>
          <span class="product-count" id="productCount">0 ITEMS</span>
        </div>
        <div class="catalog-grid" id="catalogGrid" aria-live="polite"></div>
        <div class="empty-state" id="emptyState" hidden>
          <span class="empty-symbol">✳</span>
          <h2>Something beautiful is coming.</h2>
          <p>Add your products to <code>data/products.json</code> to populate the collection.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>ROSA NERA <span>·</span> A curated collection</p>
    </footer>
  </div>

  <div class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer-close icon-button" id="viewerClose" aria-label="Close product">×</button>
    <button class="sound-toggle" id="soundToggle" aria-label="Turn sound on">SOUND OFF</button>
    <div class="viewer-track" id="viewerTrack"></div>
    <div class="swipe-hint" id="swipeHint">SWIPE UP FOR NEXT</div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
